name: Test NtpFix on Windows

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /LD /O2 /W4 ntpfix.c ws2_32.lib advapi32.lib user32.lib /Fe:ntpfix.dll
          if not exist ntpfix.dll exit /b 1
          echo Build successful

      - name: Verify DLL exports
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          dumpbin /exports ntpfix.dll
          dumpbin /exports ntpfix.dll | findstr "TimeProvOpen TimeProvCommand TimeProvClose Register Deregister"
          if %errorlevel% neq 0 exit /b 1
          echo All exports present

      - name: Pre-install NTP tests
        shell: powershell
        run: |
          Write-Host "=== Test: NTP from ephemeral port ===" -ForegroundColor Cyan
          $udp = New-Object System.Net.Sockets.UdpClient
          $udp.Client.ReceiveTimeout = 5000
          $packet = [byte[]]::new(48)
          $packet[0] = 0x23
          $udp.Send($packet, 48, "216.239.35.8", 123) | Out-Null
          $ep = New-Object System.Net.IPEndPoint([System.Net.IPAddress]::Any, 0)
          $resp = $udp.Receive([ref]$ep)
          $port = $udp.Client.LocalEndPoint.Port
          $udp.Close()
          if ($resp.Length -ne 48) { Write-Error "Bad response"; exit 1 }
          $mode = $resp[0] -band 0x07
          $stratum = $resp[1]
          Write-Host "  Response: $($resp.Length) bytes, mode=$mode, stratum=$stratum, src_port=$port"
          if ($mode -ne 4) { Write-Error "Not server mode"; exit 1 }
          if ($stratum -lt 1 -or $stratum -gt 15) { Write-Error "Bad stratum"; exit 1 }
          if ($port -le 1024) { Write-Error "Used low port"; exit 1 }
          Write-Host "  PASS: NTP works from ephemeral port" -ForegroundColor Green

      - name: Simulate ISP port block
        shell: powershell
        run: |
          Write-Host "=== Simulating ISP NTP reflection DDoS filter ===" -ForegroundColor Cyan
          Write-Host "  Blocking outbound UDP from source port 123" -ForegroundColor Yellow
          Write-Host "  (Reproduces Vinteleport AS24945 behavior)"

          # Block outbound UDP from local port 123 - this is what the ISP does:
          # drops packets where src_port=123, which kills w32time's built-in NtpClient
          netsh advfirewall firewall add rule name="SimulateISP-BlockNTP123" `
            dir=out protocol=udp localport=123 action=block | Out-Host

          # Verify the rule exists
          netsh advfirewall firewall show rule name="SimulateISP-BlockNTP123" | Out-Host

          # Prove it works: NTP from port 123 should now fail
          Write-Host ""
          Write-Host "  Testing NTP from port 123 (should fail)..." -ForegroundColor Yellow
          $blocked = $false
          try {
              $udp = New-Object System.Net.Sockets.UdpClient(123)
              $udp.Client.ReceiveTimeout = 3000
              $packet = [byte[]]::new(48)
              $packet[0] = 0x23
              $udp.Send($packet, 48, "216.239.35.8", 123) | Out-Null
              $ep = New-Object System.Net.IPEndPoint([System.Net.IPAddress]::Any, 0)
              try {
                  $resp = $udp.Receive([ref]$ep)
                  $blocked = $false
              } catch {
                  $blocked = $true
              }
              $udp.Close()
          } catch {
              # Can't bind to 123 (w32time holds it) - also proves the point
              $blocked = $true
              Write-Host "    (Port 123 in use by w32time, also proves the block)" -ForegroundColor DarkGray
          }

          if ($blocked) {
              Write-Host "  PASS: NTP from port 123 is blocked" -ForegroundColor Green
          } else {
              Write-Host "  FAIL: NTP from port 123 still works!" -ForegroundColor Red
              exit 1
          }

          # Prove ephemeral port still works (NtpFix's approach)
          Write-Host ""
          Write-Host "  Testing NTP from ephemeral port (should still work)..." -ForegroundColor Yellow
          $udp2 = New-Object System.Net.Sockets.UdpClient
          $udp2.Client.ReceiveTimeout = 5000
          $packet2 = [byte[]]::new(48)
          $packet2[0] = 0x23
          $udp2.Send($packet2, 48, "216.239.35.8", 123) | Out-Null
          $ep2 = New-Object System.Net.IPEndPoint([System.Net.IPAddress]::Any, 0)
          $resp2 = $udp2.Receive([ref]$ep2)
          $port2 = $udp2.Client.LocalEndPoint.Port
          $udp2.Close()

          if ($resp2.Length -eq 48) {
              Write-Host "  PASS: NTP from ephemeral port $port2 works through the block" -ForegroundColor Green
          } else {
              Write-Host "  FAIL: Ephemeral port NTP also broken" -ForegroundColor Red
              exit 1
          }

      - name: Check w32time baseline (with port block active)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== w32time status with ISP block active ===" -ForegroundColor Cyan
          net start w32time 2>&1 | Out-Host
          w32tm /query /status
          w32tm /query /configuration | Select-String "NtpClient|NtpServer|Enabled|Type|NtpServer|VMICTime"

      - name: Run install.ps1
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== Running install.ps1 ===" -ForegroundColor Cyan

          # install.ps1 requires admin (which GH runners have) and stops/starts w32time
          # It also tries to build if no DLL exists, but we already built it
          .\install.ps1

      - name: Disable VMICTimeProvider
        shell: powershell
        run: |
          # GitHub runners are Hyper-V VMs - disable VMIC so NtpFix is the only provider
          $ErrorActionPreference = "Continue"
          $vmicKey = "HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\VMICTimeProvider"
          if (Test-Path $vmicKey) {
              Set-ItemProperty -Path $vmicKey -Name "Enabled" -Value 0 -Type DWord
              Write-Host "Disabled VMICTimeProvider (Hyper-V VM)"
              net stop w32time 2>&1 | Out-Host
              net start w32time 2>&1 | Out-Host
          }

      - name: Wait for NtpFix to sync
        shell: powershell
        run: |
          Write-Host "=== Waiting for NtpFix to produce samples ===" -ForegroundColor Cyan
          Write-Host "  (Port 123 block is still active - NtpFix must use ephemeral ports)"

          # Check NtpFix event log entries to confirm DLL loaded
          Start-Sleep -Seconds 5
          Write-Host "  NtpFix event log entries:"
          Get-WinEvent -LogName Application -FilterXPath "*[System[Provider[@Name='NtpFix']]]" -MaxEvents 10 -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "    $($_.TimeCreated): $($_.Message)"
          }

          # Poll every 10 seconds for up to 3 minutes
          $maxAttempts = 18
          $synced = $false
          for ($i = 1; $i -le $maxAttempts; $i++) {
              Start-Sleep -Seconds 10
              $status = w32tm /query /status 2>&1
              $source = ($status | Select-String "Source:") -as [string]
              $stratumLine = ($status | Select-String "Stratum:") -as [string]
              Write-Host "  Attempt $i/$maxAttempts - $source | $stratumLine"
              if ($source -match "NtpFix") {
                  $synced = $true
                  break
              }
          }

          # Show NtpFix logs regardless
          Write-Host ""
          Write-Host "  NtpFix event log entries after wait:"
          Get-WinEvent -LogName Application -FilterXPath "*[System[Provider[@Name='NtpFix']]]" -MaxEvents 20 -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "    $($_.TimeCreated): $($_.Message)"
          }

          if (-not $synced) {
              Write-Host "  WARNING: Source not yet NtpFix after $maxAttempts attempts" -ForegroundColor Yellow
          }

      - name: Run test.ps1
        shell: powershell
        run: |
          Write-Host "=== Running test.ps1 ===" -ForegroundColor Cyan
          .\test.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run diag.ps1
        shell: powershell
        run: |
          Write-Host "=== Running diag.ps1 ===" -ForegroundColor Cyan
          .\diag.ps1

      - name: Verify NtpFix integration
        shell: powershell
        run: |
          Write-Host "=== Final verification (port 123 block still active) ===" -ForegroundColor Cyan
          $pass = 0; $fail = 0

          # Confirm the firewall rule is still in place
          $rule = netsh advfirewall firewall show rule name="SimulateISP-BlockNTP123" 2>&1
          if ($rule -match "SimulateISP") {
              Write-Host "  PASS: ISP port block simulation still active" -ForegroundColor Green; $pass++
          } else {
              Write-Host "  FAIL: ISP port block simulation missing!" -ForegroundColor Red; $fail++
          }

          # Check w32time status
          $status = w32tm /query /status 2>&1
          Write-Host ($status | Out-String)

          # Check source
          $source = ($status | Select-String "Source:") -as [string]
          $isNtpFix = $source -match "NtpFix"
          if ($isNtpFix) {
              Write-Host "  PASS: Source is NtpFix" -ForegroundColor Green; $pass++
          } else {
              Write-Host "  FAIL: Source is not NtpFix ($source)" -ForegroundColor Red; $fail++
          }

          # Check stratum (should be 2 = synced to stratum 1 NTP server)
          $stratumLine = ($status | Select-String "Stratum:") -as [string]
          if ($stratumLine -match "Stratum:\s*(\d+)") {
              $stratum = [int]$Matches[1]
              if ($stratum -ge 2 -and $stratum -le 5) {
                  Write-Host "  PASS: Stratum=$stratum (synced despite port 123 block)" -ForegroundColor Green; $pass++
              } else {
                  Write-Host "  FAIL: Stratum=$stratum (unexpected)" -ForegroundColor Red; $fail++
              }
          }

          # Check it's not LOCL anymore
          $refId = ($status | Select-String "ReferenceId:") -as [string]
          $isLocal = $refId -match "LOCL"
          if (-not $isLocal) {
              Write-Host "  PASS: Not using Local CMOS Clock" -ForegroundColor Green; $pass++
          } else {
              Write-Host "  FAIL: Still using LOCL" -ForegroundColor Red; $fail++
          }

          # Check NtpFix is registered
          $key = "HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpFix"
          $enabled = (Get-ItemProperty $key -ErrorAction SilentlyContinue).Enabled
          if ($enabled -eq 1) {
              Write-Host "  PASS: NtpFix registered and enabled" -ForegroundColor Green; $pass++
          } else {
              Write-Host "  FAIL: NtpFix not registered" -ForegroundColor Red; $fail++
          }

          # Check built-in NtpClient is disabled
          $ntpKey = "HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpClient"
          $ntpEnabled = (Get-ItemProperty $ntpKey -ErrorAction SilentlyContinue).Enabled
          if ($ntpEnabled -eq 0) {
              Write-Host "  PASS: Built-in NtpClient disabled" -ForegroundColor Green; $pass++
          } else {
              Write-Host "  FAIL: Built-in NtpClient still enabled" -ForegroundColor Red; $fail++
          }

          # Check w32time startup type
          $svc = Get-Service w32time
          if ($svc.StartType -eq "Automatic") {
              Write-Host "  PASS: w32time set to auto-start" -ForegroundColor Green; $pass++
          } else {
              Write-Host "  FAIL: w32time startup is $($svc.StartType), should be Automatic" -ForegroundColor Red; $fail++
          }

          Write-Host ""
          Write-Host "Results: $pass passed, $fail failed" -ForegroundColor $(if ($fail -eq 0) { "Green" } else { "Red" })
          if ($fail -gt 0) { exit 1 }

      - name: Run uninstall.ps1
        shell: powershell
        run: |
          Write-Host "=== Running uninstall.ps1 ===" -ForegroundColor Cyan
          $ErrorActionPreference = "Continue"
          .\uninstall.ps1

      - name: Verify uninstall
        shell: powershell
        run: |
          Write-Host "=== Verifying uninstall ===" -ForegroundColor Cyan
          $pass = 0; $fail = 0

          # NtpFix provider should be gone
          $key = "HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpFix"
          if (-not (Test-Path $key)) {
              Write-Host "  PASS: NtpFix provider removed" -ForegroundColor Green; $pass++
          } else {
              Write-Host "  FAIL: NtpFix provider still registered" -ForegroundColor Red; $fail++
          }

          # NtpClient should be re-enabled
          $ntpKey = "HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\NtpClient"
          $ntpEnabled = (Get-ItemProperty $ntpKey -ErrorAction SilentlyContinue).Enabled
          if ($ntpEnabled -eq 1) {
              Write-Host "  PASS: Built-in NtpClient re-enabled" -ForegroundColor Green; $pass++
          } else {
              Write-Host "  FAIL: NtpClient still disabled (Enabled=$ntpEnabled)" -ForegroundColor Red; $fail++
          }

          # w32time should still be running
          $svc = Get-Service w32time -ErrorAction SilentlyContinue
          if ($svc.Status -eq "Running") {
              Write-Host "  PASS: w32time still running" -ForegroundColor Green; $pass++
          } else {
              Write-Host "  FAIL: w32time not running ($($svc.Status))" -ForegroundColor Red; $fail++
          }

          Write-Host ""
          Write-Host "Results: $pass passed, $fail failed" -ForegroundColor $(if ($fail -eq 0) { "Green" } else { "Red" })
          if ($fail -gt 0) { exit 1 }

      - name: Collect debug logs on failure
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== Debug info ===" -ForegroundColor Yellow
          w32tm /query /status /verbose
          Write-Host ""
          w32tm /query /configuration
          Write-Host ""
          w32tm /query /peers
          Write-Host ""
          Write-Host "=== Firewall rules ===" -ForegroundColor Yellow
          netsh advfirewall firewall show rule name="SimulateISP-BlockNTP123"
          Write-Host ""
          Write-Host "=== Time Service events ===" -ForegroundColor Yellow
          Get-WinEvent -LogName System -FilterXPath "*[System[Provider[@Name='Microsoft-Windows-Time-Service']]]" -MaxEvents 20 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message
          Write-Host ""
          Write-Host "=== NtpFix events ===" -ForegroundColor Yellow
          Get-WinEvent -LogName Application -FilterXPath "*[System[Provider[@Name='NtpFix']]]" -MaxEvents 30 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message

      - name: Upload DLL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ntpfix-dll
          path: ntpfix.dll
